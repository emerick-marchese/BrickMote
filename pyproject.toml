[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brickmote"
version = "1.0.4"
description = "BrickMote - logiciel de bureau à distance chiffré de bout en bout"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
    "spake2>=0.9",
    "PySide6>=6.6",
    "mss>=9.0",
    "pynput>=1.7.6",
    "Pillow>=10.0",
    "numpy>=1.26",
    "qrcode>=7.4",
    "psutil>=5.9",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pyinstaller>=6.5"]

[project.scripts]
brickmote-relay = "brickmote.server.relay:main"

[project.gui-scripts]
brickmote = "brickmote.gui.app:main"

[tool.setuptools.packages.find]
include = ["brickmote*"]
