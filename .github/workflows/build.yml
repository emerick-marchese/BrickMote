name: Tests et exécutables

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publier une release (ex. v1.0.0). Laisser vide pour une simple compilation."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: pip install -r requirements.txt pyinstaller
      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import brickmote; print(brickmote.__version__)')" >> "$GITHUB_OUTPUT"
      - run: python packaging/make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Serveur relais par défaut (secret, jamais dans le code source)
        shell: bash
        env:
          BRICKMOTE_DEFAULT_RELAY: ${{ secrets.BRICKMOTE_DEFAULT_RELAY }}
          BRICKMOTE_DEFAULT_RELAY_FP: ${{ secrets.BRICKMOTE_DEFAULT_RELAY_FP }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python packaging/embed_relay.py
          if [ -z "$BRICKMOTE_DEFAULT_RELAY" ] && [ -n "$RELEASE_VERSION" ]; then
            echo "::warning::Release sans serveur relais par défaut : ajoutez les secrets BRICKMOTE_DEFAULT_RELAY et BRICKMOTE_DEFAULT_RELAY_FP."
          fi
      - name: Application (exe portable Windows / BrickMote.app macOS)
        if: runner.os != 'Linux'
        run: pyinstaller --noconfirm --workpath build/portable packaging/brickmote.spec
      - name: Version en dossier (installateur Windows / paquet Linux)
        if: runner.os != 'macOS'
        env:
          BRICKMOTE_ONEDIR: "1"
        run: pyinstaller --noconfirm --workpath build/onedir packaging/brickmote.spec
      - name: Installateur Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\dist\BrickMote" "/DOutputDir=$PWD\out" packaging\windows\brickmote.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Préparer les fichiers à publier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          V="${{ steps.ver.outputs.version }}"
          case "$RUNNER_OS" in
            Windows)
              cp dist/BrickMote.exe "out/BrickMote-${V}-Windows-x64-portable.exe" ;;
            macOS)
              mkdir dmg
              cp -R dist/BrickMote.app dmg/
              ln -s /Applications dmg/Applications
              hdiutil create -volname BrickMote -srcfolder dmg -ov -format UDZO "out/BrickMote-${V}-macOS-AppleSilicon.dmg" ;;
            Linux)
              tar -C dist -czf "out/BrickMote-${V}-Linux-x64.tar.gz" BrickMote
              packaging/linux/build-deb.sh "$V" "out/BrickMote-${V}-Linux-x64.deb" ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: BrickMote-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    # published even when one platform could not be built (e.g. no macOS
    # machine available): Windows and Linux are required, checked below
    if: ${{ !cancelled() && needs.build.result != 'skipped' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Fichiers indispensables (Windows, Linux)
        run: |
          ls assets
          ls assets/BrickMote-Setup-*-Windows-x64.exe assets/*-Linux-x64.tar.gz assets/*-Linux-x64.deb
          ls assets/*macOS* >/dev/null 2>&1 || echo "::warning::Pas de version macOS dans cette release (compilation macOS indisponible)."
      - name: Empreintes SHA-256
        run: cd assets && sha256sum * | tee SHA256SUMS.txt
      - name: Signature des mises à jour (Ed25519)
        env:
          BRICKMOTE_UPDATE_SIGNING_KEY: ${{ secrets.BRICKMOTE_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$BRICKMOTE_UPDATE_SIGNING_KEY" ]; then
            echo "::warning::Release non signée : les PC installés ne s'y mettront pas à jour automatiquement (secret BRICKMOTE_UPDATE_SIGNING_KEY absent)."
            exit 0
          fi
          pip install --quiet cryptography
          python packaging/sign_release.py assets/SHA256SUMS.txt
      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version invalide : $TAG (attendu : vX.Y.Z)"; exit 1
          fi
          if ! grep -q "__version__ = \"${TAG#v}\"" brickmote/__init__.py; then
            echo "La version de brickmote/__init__.py ne correspond pas à $TAG"; exit 1
          fi
          notes="release-notes/${TAG}.md"
          [ -f "$notes" ] || notes=/dev/null
          {
            cat "$notes"
            echo
            echo "### Empreintes SHA-256"
            echo '```'
            cat assets/SHA256SUMS.txt
            echo '```'
          } > notes.md
          args=(--repo "$GITHUB_REPOSITORY" --title "BrickMote ${TAG#v}" --notes-file notes.md)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")  # the tag is created on this commit
          fi
          gh release create "$TAG" assets/* "${args[@]}"
