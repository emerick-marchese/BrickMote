name: Tests et exécutables

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publier une release (ex. v1.0.0). Laisser vide pour une simple compilation."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: BrickMote-Windows-x64.exe
          - os: macos-latest
            asset: BrickMote-macOS-AppleSilicon.zip
          - os: ubuntu-22.04
            asset: BrickMote-Linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: pip install -r requirements.txt pyinstaller
      - run: python packaging/make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller --noconfirm packaging/brickmote.spec
      - name: Préparer le fichier à publier
        shell: bash
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Windows) cp dist/BrickMote.exe "out/${{ matrix.asset }}" ;;
            macOS)   ditto -c -k --sequesterRsrc --keepParent dist/BrickMote.app "out/${{ matrix.asset }}" ;;
            Linux)   tar -C dist -czf "out/${{ matrix.asset }}" BrickMote ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: BrickMote-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Empreintes SHA-256
        run: cd assets && sha256sum * | tee SHA256SUMS.txt
      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version invalide : $TAG (attendu : vX.Y.Z)"; exit 1
          fi
          if ! grep -q "__version__ = \"${TAG#v}\"" brickmote/__init__.py; then
            echo "La version de brickmote/__init__.py ne correspond pas à $TAG"; exit 1
          fi
          notes="release-notes/${TAG}.md"
          [ -f "$notes" ] || notes=/dev/null
          {
            cat "$notes"
            echo
            echo "### Empreintes SHA-256"
            echo '```'
            cat assets/SHA256SUMS.txt
            echo '```'
          } > notes.md
          args=(--repo "$GITHUB_REPOSITORY" --title "BrickMote ${TAG#v}" --notes-file notes.md)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")  # the tag is created on this commit
          fi
          gh release create "$TAG" assets/* "${args[@]}"
