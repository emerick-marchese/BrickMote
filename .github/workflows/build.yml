name: Tests et exécutables

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: pip install -r requirements.txt pyinstaller
      - run: python packaging/make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller --noconfirm packaging/brickmote.spec
      - name: Archive macOS
        if: runner.os == 'macOS'
        run: cd dist && zip -r -y BrickMote-macOS.zip BrickMote.app
      - uses: actions/upload-artifact@v4
        with:
          name: BrickMote-${{ runner.os }}
          path: |
            dist/BrickMote.exe
            dist/BrickMote-macOS.zip
            dist/BrickMote
          if-no-files-found: ignore
